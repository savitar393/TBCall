spring.application.name=tbcall
spring.datasource.url=${TBCALL_DB_URL}
spring.datasource.username=${TBCALL_DB_USER}
spring.datasource.password=${TBCALL_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=true
tbcall.security.production=${TBCALL_PRODUCTION:true}
tbcall.security.expose-verification-tokens=${TBCALL_EXPOSE_VERIFICATION_TOKENS:false}
tbcall.security.cookie-secure=${TBCALL_COOKIE_SECURE:true}
tbcall.security.allowed-origins=${TBCALL_CORS_ALLOWED_ORIGINS:}
tbcall.security.verification-lifetime=${TBCALL_VERIFICATION_LIFETIME:30m}
tbcall.security.bootstrap-email=${TBCALL_BOOTSTRAP_EMAIL:}
tbcall.security.bootstrap-phone=${TBCALL_BOOTSTRAP_PHONE:}
tbcall.security.bootstrap-password=${TBCALL_BOOTSTRAP_PASSWORD:}
tbcall.monitoring.scheduler-enabled=${TBCALL_MONITORING_SCHEDULER_ENABLED:true}
tbcall.monitoring.sweep-interval-ms=${TBCALL_MONITORING_SWEEP_INTERVAL_MS:60000}
# Messaging is disabled by default. SIMULATED additionally requires nonproduction dev/test.
tbcall.reminders.mode=${TBCALL_REMINDER_MODE:DISABLED}
tbcall.reminders.scheduler-enabled=${TBCALL_REMINDER_SCHEDULER_ENABLED:false}
tbcall.reminders.planning-hours=${TBCALL_REMINDER_PLANNING_HOURS:24}
tbcall.reminders.batch-size=${TBCALL_REMINDER_BATCH_SIZE:100}
tbcall.reminders.max-attempts=${TBCALL_REMINDER_MAX_ATTEMPTS:3}
tbcall.reminders.max-lateness-minutes=${TBCALL_REMINDER_MAX_LATENESS_MINUTES:10}
tbcall.reminders.claim-seconds=${TBCALL_REMINDER_CLAIM_SECONDS:30}
tbcall.reminders.retry-seconds=${TBCALL_REMINDER_RETRY_SECONDS:15}
tbcall.reminders.interval-ms=${TBCALL_REMINDER_INTERVAL_MS:15000}
