spring.application.name=tbcall
spring.datasource.url=${TBCALL_DB_URL}
spring.datasource.username=${TBCALL_DB_USER}
spring.datasource.password=${TBCALL_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=true
# Private local VOT is synthetic development only; production enablement fails closed.
tbcall.vot.enabled=${TBCALL_VOT_ENABLED:false}
tbcall.vot.synthetic-only=${TBCALL_VOT_SYNTHETIC_ONLY:true}
tbcall.vot.storage-path=${TBCALL_VOT_STORAGE_PATH:}
tbcall.vot.max-file-bytes=${TBCALL_VOT_MAX_FILE_BYTES:20971520}
tbcall.vot.retention-days=${TBCALL_VOT_RETENTION_DAYS:7}
tbcall.vot.cleanup-enabled=${TBCALL_VOT_CLEANUP_ENABLED:true}
tbcall.vot.cleanup-interval-ms=${TBCALL_VOT_CLEANUP_INTERVAL_MS:3600000}
tbcall.security.production=${TBCALL_PRODUCTION:true}
tbcall.security.expose-verification-tokens=${TBCALL_EXPOSE_VERIFICATION_TOKENS:false}
tbcall.security.cookie-secure=${TBCALL_COOKIE_SECURE:true}
tbcall.security.allowed-origins=${TBCALL_CORS_ALLOWED_ORIGINS:}
tbcall.security.verification-lifetime=${TBCALL_VERIFICATION_LIFETIME:30m}
tbcall.security.bootstrap-email=${TBCALL_BOOTSTRAP_EMAIL:}
tbcall.security.bootstrap-phone=${TBCALL_BOOTSTRAP_PHONE:}
tbcall.security.bootstrap-password=${TBCALL_BOOTSTRAP_PASSWORD:}
tbcall.monitoring.scheduler-enabled=${TBCALL_MONITORING_SCHEDULER_ENABLED:true}
tbcall.monitoring.sweep-interval-ms=${TBCALL_MONITORING_SWEEP_INTERVAL_MS:60000}
# Messaging is disabled by default. SIMULATED additionally requires nonproduction dev/test.
tbcall.reminders.mode=${TBCALL_REMINDER_MODE:DISABLED}
tbcall.reminders.scheduler-enabled=${TBCALL_REMINDER_SCHEDULER_ENABLED:false}
tbcall.reminders.planning-hours=${TBCALL_REMINDER_PLANNING_HOURS:24}
tbcall.reminders.batch-size=${TBCALL_REMINDER_BATCH_SIZE:100}
tbcall.reminders.max-attempts=${TBCALL_REMINDER_MAX_ATTEMPTS:3}
tbcall.reminders.max-lateness-minutes=${TBCALL_REMINDER_MAX_LATENESS_MINUTES:10}
tbcall.reminders.claim-seconds=${TBCALL_REMINDER_CLAIM_SECONDS:30}
tbcall.reminders.retry-seconds=${TBCALL_REMINDER_RETRY_SECONDS:15}
tbcall.reminders.interval-ms=${TBCALL_REMINDER_INTERVAL_MS:15000}
tbcall.reminders.meta.business-account-id=${TBCALL_WHATSAPP_BUSINESS_ACCOUNT_ID:}
tbcall.reminders.meta.test-phone-number-id=${TBCALL_WHATSAPP_TEST_PHONE_NUMBER_ID:}
tbcall.reminders.meta.access-token=${TBCALL_WHATSAPP_ACCESS_TOKEN:}
tbcall.reminders.meta.app-secret=${TBCALL_WHATSAPP_APP_SECRET:}
tbcall.reminders.meta.verify-token=${TBCALL_WHATSAPP_VERIFY_TOKEN:}
tbcall.reminders.meta.graph-version=${TBCALL_WHATSAPP_GRAPH_VERSION:v23.0}
tbcall.reminders.meta.template-name=${TBCALL_WHATSAPP_TEMPLATE_NAME:}
tbcall.reminders.meta.template-language=${TBCALL_WHATSAPP_TEMPLATE_LANGUAGE:}
tbcall.reminders.meta.test-sender-confirmed=${TBCALL_WHATSAPP_TEST_SENDER_CONFIRMED:false}
tbcall.reminders.meta.template-approved=${TBCALL_WHATSAPP_TEMPLATE_APPROVED:false}
tbcall.reminders.meta.synthetic-environment=${TBCALL_WHATSAPP_SYNTHETIC_ENVIRONMENT:false}
tbcall.reminders.meta.allowed-recipients=${TBCALL_WHATSAPP_TEST_RECIPIENTS:}
tbcall.reminders.meta.request-timeout-seconds=${TBCALL_WHATSAPP_TIMEOUT_SECONDS:5}
tbcall.reminders.meta.webhook-max-age-hours=${TBCALL_WHATSAPP_WEBHOOK_MAX_AGE_HOURS:168}
# EMAIL/TELEGRAM are manual synthetic tests only: CHANNEL_TEST + explicit dev/test
# profile + TBCALL_PRODUCTION=false + synthetic-environment=true. Keep scheduler
# false; this mode never activates WhatsApp. Disabled defaults require no secrets.
# Inject credentials through a private process environment/secret source, never
# client code, command arguments, tracked env files or logs. Allowlist 1-5 exact
# canonical verified account emails/private test chat IDs per enabled provider.
# Shared safety: 1-8 second complete HTTP timeout, lease > timeout+2 seconds;
# at most 3 confirmed-safe attempts within the original ten-minute due window.
# Resend accepts only the fixed neutral template; API acceptance is not delivery.
# Telegram retries only if retry_after <= TBCALL_REMINDER_RETRY_SECONDS. Longer
# flood waits are terminal; timeouts/ambiguous outcomes are never resent.
# Use a dedicated bot with no webhook or other getUpdates consumer. Linking
# requires a single-use 5-minute SELF-bound nonce; linking never grants consent.
# STOP may withdraw current matching consent within the 24-hour update window,
# even after role/status restriction; a STOP before a newer grant is ignored.
# SYSTEM_ADMIN + USER_ACCOUNT_MANAGE + CSRF + explicit confirmation is required:
# POST /api/v1/admin/medication-reminders/channel-test-plan
#   {"confirmTestOperation":true}
# POST /api/v1/admin/medication-reminders/channel-test-telegram-poll (same body)
# POST /api/v1/admin/medication-reminders/channel-test-dispatch
#   {"jobId":"<owned synthetic job UUID>","confirmTestOperation":true}
# Each request is one manual operation; no background polling or provider probe.
# Protocols: https://resend.com/docs/api-reference/emails/send-email
# https://resend.com/docs/api-reference/errors and https://core.telegram.org/bots/api
# Reviewed 2026-10-16. No inbox/device delivery callback is supplied for these channels.
tbcall.reminders.channels.email-enabled=${TBCALL_EMAIL_ENABLED:false}
tbcall.reminders.channels.telegram-enabled=${TBCALL_TELEGRAM_ENABLED:false}
tbcall.reminders.channels.synthetic-environment=${TBCALL_CHANNEL_SYNTHETIC_ENVIRONMENT:false}
tbcall.reminders.channels.resend-api-key=${RESEND_API_KEY:}
tbcall.reminders.channels.email-from=${TBCALL_EMAIL_FROM:TBCall Test <test@notify.umkmtumbuh.xyz>}
tbcall.reminders.channels.email-recipients=${TBCALL_EMAIL_TEST_RECIPIENTS:}
tbcall.reminders.channels.telegram-bot-token=${TELEGRAM_BOT_TOKEN:}
tbcall.reminders.channels.telegram-bot-username=${TBCALL_TELEGRAM_BOT_USERNAME:}
tbcall.reminders.channels.telegram-recipients=${TBCALL_TELEGRAM_TEST_RECIPIENTS:}
tbcall.reminders.channels.telegram-exclusive-consumer-confirmed=${TBCALL_TELEGRAM_EXCLUSIVE_CONSUMER_CONFIRMED:false}
tbcall.reminders.channels.timeout-seconds=${TBCALL_CHANNEL_TIMEOUT_SECONDS:5}
